<!doctype html>
<html lang="ja">
  <head>
    <script>
      // React DevToolsが競合・無効化(isDisabled)されている場合に削除して、Fast Refreshが正常に動作するようにする
      if (window.__REACT_DEVTOOLS_GLOBAL_HOOK__ && window.__REACT_DEVTOOLS_GLOBAL_HOOK__.isDisabled) {
        delete window.__REACT_DEVTOOLS_GLOBAL_HOOK__;
      }
    </script>
    <style>
      /* 初期表示時のちらつき（フラッシュ）を防ぐための背景色設定 */
      html, body {
        background-color: #0b0d10;
        margin: 0;
        padding: 0;
      }
      html {
        color-scheme: dark;
      }
    </style>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tick Replay Controller</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
