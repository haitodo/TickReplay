<!doctype html>
<html lang="en">
  <head>
    <script>
      // React DevToolsが競合・無効化(isDisabled)されている場合に削除して、Fast Refreshが正常に動作するようにする
      if (window.__REACT_DEVTOOLS_GLOBAL_HOOK__ && window.__REACT_DEVTOOLS_GLOBAL_HOOK__.isDisabled) {
        delete window.__REACT_DEVTOOLS_GLOBAL_HOOK__;
      }
      // 起動時の白画面ちらつき防止のため、保存されたテーマを即座に適用する
      try {
        var mode = localStorage.getItem("theme-mode") || "dark";
        document.documentElement.setAttribute("data-theme", mode);
      } catch (e) {}
    </script>
    <style>
      /* 初期表示時の白いちらつき（フラッシュ）を防ぐための背景色設定 */
      html, body {
        background-color: #0D0F14; /* ダークテーマのデフォルト背景色 */
        margin: 0;
        padding: 0;
      }
      html[data-theme="light"], html[data-theme="light"] body {
        background-color: #fdf6e2; /* ライトテーマ（ウォームクリーム）のデフォルト背景色 */
      }
    </style>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tick Replay Controller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
