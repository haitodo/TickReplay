[package]
name = "tick-replay"
version = "1.0.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tick_replay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Replay runtime is latency-sensitive: keep the release binary optimized for
# throughput and allow LLVM to inline across crate boundaries.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
chrono = "0.4"
rfd = "0.15"
bytemuck = { version = "1", features = ["derive"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
parquet = { version = "53", default-features = false, features = ["arrow", "snap", "zstd"] }
arrow = { version = "53", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
